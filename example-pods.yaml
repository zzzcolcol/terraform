apiVersion: v1
kind: Pod
metadata:
  name: example-app
  namespace: default
  labels:
    app: example-app
spec:
  initContainers:
    - name: init-nginx-config
      image: busybox
      command: ['sh', '-c', 'echo "server { listen 8080; location / { root /usr/share/nginx/html; index index.html; }}" > /etc/nginx/conf.d/default.conf']
      volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d
  containers:
    - name: example-app
      image: nginx
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d
  volumes:
    - name: nginx-config-volume
      emptyDir: {}
