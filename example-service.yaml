apiVersion: v1
kind: Service
metadata:
  name: example-service
  namespace: default
spec:
  selector:
    app: example-app  # ✅ Pod의 label과 일치해야 함
  ports:
    - protocol: TCP
      port: 80         # ✅ Ingress에서 접근하는 포트
      targetPort: 8080 # ✅ Pod 컨테이너에서 사용하는 포트
  type: ClusterIP      # ✅ ALB Ingress Controller 사용 시 ClusterIP 필요
