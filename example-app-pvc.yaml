# 📌 2️⃣ PersistentVolumeClaim (PVC) 정의
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: example-app-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce  # 하나의 노드에서만 읽기/쓰기 가능
  resources:
    requests:
      storage: 5Gi  # 요청할 볼륨 크기
  storageClassName: ebs-sc  # 위에서 정의한 StorageClass 사용